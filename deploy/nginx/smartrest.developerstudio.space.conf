# SmartRestaurant demo (CSE5015). Managed by hand, not by aaPanel; certificate from certbot (/etc/letsencrypt,
# renewed by certbot.timer, deploy hook reloads nginx). Proxies to gunicorn on 127.0.0.1:39500 only.
server {
    listen 80;
    listen [::]:80;
    server_name smartrest.developerstudio.space;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/smartrest-acme;
        default_type text/plain;
    }
    location / {
        return 301 https://$host$request_uri;
    }
    access_log /www/wwwlogs/smartrest.developerstudio.space.log;
    error_log /www/wwwlogs/smartrest.developerstudio.space.error.log;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name smartrest.developerstudio.space;

    ssl_certificate     /etc/letsencrypt/live/smartrest.developerstudio.space/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/smartrest.developerstudio.space/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 6m;          # CSV uploads; the app itself refuses more than 5 MB

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/smartrest-acme;
        default_type text/plain;
    }
    location / {
        proxy_pass http://127.0.0.1:39500;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Connection "";
        proxy_cache off;              # proxy.conf turns caching on globally; never cache logged-in pages
        proxy_next_upstream off;      # proxy.conf retries on 500/503/404; one upstream, never replay requests
        proxy_read_timeout 130s;      # gunicorn --timeout 120 (model training from the admin page)
        proxy_send_timeout 130s;
    }
    access_log /www/wwwlogs/smartrest.developerstudio.space.log;
    error_log /www/wwwlogs/smartrest.developerstudio.space.error.log;
}
