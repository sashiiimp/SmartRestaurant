{% extends "base.html" %}
{% block title %}Admin - SmartRestaurant{% endblock %}
{% block content %}
<div id="app" v-cloak>
  <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
    <h1 class="h4 m-0">System overview</h1>
    <div class="btn-group" role="group" aria-label="Range"><button class="btn btn-outline-secondary" :class="{ active: range === 7 }" @click="range = 7; load()">Last 7 days</button><button class="btn btn-outline-secondary" :class="{ active: range === 30 }" @click="range = 30; load()">Last 30 days</button></div>
  </div>
  <div v-if="error" class="alert alert-danger" role="alert">[[ error ]]</div>
  <sr-loading v-if="loading" :tiles="4" :cards="2"></sr-loading>
  <template v-else-if="d">
    <div v-if="d.items_without_recipe.length" class="alert alert-warning py-2">Menu items without a recipe (their ingredient needs count as zero): [[ d.items_without_recipe.join(', ') ]]. <a href="/admin/catalog">Add recipes</a></div>
    <div v-if="!d.active_model" class="alert alert-warning py-2">No active forecasting model. <a href="/admin/models">Train and activate one</a>.</div>
    <div class="row g-3 mb-3">
      <div class="col-6 col-lg-3"><sr-stat-tile label="Portions sold" icon="bag" :value="ui.num(d.sales.quantity, 0)" :hint="'Revenue ' + ui.money(d.sales.revenue)" href="/admin/monitor"></sr-stat-tile></div>
      <div class="col-6 col-lg-3"><sr-stat-tile label="Forecast, next 7 days" icon="trending" tone="info" :value="ui.num(d.forecast_next7_total, 0)" hint="portions" href="/admin/models"></sr-stat-tile></div>
      <div class="col-6 col-lg-3"><sr-stat-tile label="Low or out of stock" icon="package" :value="d.low_stock_count" :tone="d.low_stock_count ? 'warning' : 'success'"></sr-stat-tile></div>
      <div class="col-6 col-lg-3"><sr-stat-tile label="Food waste" icon="trash" :value="ui.num(d.waste.quantity, 0) + ' portions'" :hint="ui.money(d.waste.value) + ' at selling price'" href="/admin/monitor"></sr-stat-tile></div>
    </div>
    <div class="row g-3 mb-3">
      <div class="col-12 col-xl-8"><div class="card h-100"><div class="card-body">
        <div class="card-head"><h2 class="h6">Sales and waste, [[ ui.date(d.from) ]] to [[ ui.date(d.to) ]]</h2><a href="/admin/monitor">Full report</a></div>
        <sr-line-chart v-if="trend" :labels="trendLabels" :datasets="trendData" y-title="Portions per day" :height="260"></sr-line-chart>
        <div v-else-if="trend === undefined" class="sk" style="height: 260px"></div>
        <sr-empty v-else message="Trend data is not available right now." icon="activity"></sr-empty>
      </div></div></div>
      <div class="col-12 col-xl-4"><div class="card h-100"><div class="card-body">
        <div class="card-head"><h2 class="h6">Alerts by severity</h2></div>
        <sr-doughnut-chart :labels="['Critical', 'Warning', 'Info']" :data="[d.alert_counts.critical, d.alert_counts.warning, d.alert_counts.info || 0]"
          :colors="['#b42318', '#e0a020', '#3b7dd8']" :center-value="alertTotal" center-label="open alerts" title="Open alerts by severity"></sr-doughnut-chart>
        <div class="legend-list">
          <div><span><span class="legend-dot" style="background:#b42318"></span>Critical</span><strong>[[ d.alert_counts.critical ]]</strong></div>
          <div><span><span class="legend-dot" style="background:#e0a020"></span>Warning</span><strong>[[ d.alert_counts.warning ]]</strong></div>
          <div><span><span class="legend-dot" style="background:#3b7dd8"></span>Info</span><strong>[[ d.alert_counts.info || 0 ]]</strong></div>
        </div>
      </div></div></div>
    </div>
    <div class="row g-3">
      <div class="col-12 col-xl-7">
        <div class="card"><div class="card-body">
          <div class="card-head"><h2 class="h6">Open alerts ([[ d.alert_counts.critical ]] critical, [[ d.alert_counts.warning ]] warning)</h2>
            <button class="btn btn-sm btn-outline-primary" :disabled="running" @click="runAlerts"><span v-if="running" class="spinner-border spinner-border-sm me-1"></span>Run alert check</button></div>
          <sr-alert-list :alerts="d.alerts" @acknowledge="ack"></sr-alert-list></div></div>
      </div>
      <div class="col-12 col-xl-5">
        <div class="card mb-3"><div class="card-body"><h2 class="h6">Forecasting</h2>
          <div v-if="d.active_model">Active model: <strong>[[ d.active_model.label ]]</strong> ([[ d.active_model.algorithm ]])
            <span class="sr-badge ms-1" :class="d.active_model.beats_baseline ? 'sr-badge-success' : 'sr-badge-warning'">[[ d.active_model.beats_baseline ? 'Beats the baseline' : 'Does not beat the baseline' ]]</span></div>
          <div v-if="d.last_run" class="small text-muted mt-1">Last run [[ ui.dateTime(d.last_run.started_at) ]]: [[ d.last_run.status ]]<span v-if="d.last_run.reason"> ([[ d.last_run.reason ]])</span></div></div></div>
        <div class="card"><div class="card-body"><h2 class="h6">Recent activity</h2>
          <ul class="activity small"><li v-for="(a, i) in d.recent_activity" :key="i"><span class="when">[[ ui.dateTime(a.time) ]]</span><span class="what">[[ a.action ]]</span></li></ul></div></div>
      </div>
    </div>
  </template>
</div>
{% endblock %}
{% block scripts %}<script src="{{ url_for('static', filename='js/pages/admin_dashboard.js') }}"></script>{% endblock %}
