{% extends "base.html" %}
{% block title %}Admin - SmartRestaurant{% endblock %}
{% block content %}
<div id="app" v-cloak class="admin-dash">
  <div class="dash-head">
    <div>
      <h1 class="h4 m-0">Dashboard</h1>
      <p class="dash-sub" v-if="d">[[ ui.date(d.from) ]] – [[ ui.date(d.to) ]] · [[ d.range_days ]] days to yesterday</p>
    </div>
    <div class="btn-group" role="group" aria-label="Reporting period">
      <button class="btn btn-outline-secondary" :class="{ active: range === 7 }" :aria-pressed="range === 7" :disabled="loading" @click="setRange(7)">Last 7 days</button>
      <button class="btn btn-outline-secondary" :class="{ active: range === 30 }" :aria-pressed="range === 30" :disabled="loading" @click="setRange(30)">Last 30 days</button>
    </div>
  </div>
  <div v-if="error" class="alert alert-danger d-flex align-items-center gap-3" role="alert">
    <span class="flex-grow-1">The dashboard could not be loaded: [[ error ]]</span>
    <button class="btn btn-sm btn-outline-danger" type="button" @click="load">Try again</button>
  </div>
  <sr-loading v-if="loading" :tiles="4" :cards="2"></sr-loading>

  <template v-else-if="d">
    <p v-if="d.coverage.days_with_sales < d.coverage.days" class="dash-note note-partial mb-3" role="note"><sr-icon name="warning" :size="16"></sr-icon><span>Sales recorded on [[ d.coverage.days_with_sales ]] of [[ d.coverage.days ]] days<template v-if="d.coverage.latest_sales_date"> (latest [[ ui.date(d.coverage.latest_sales_date) ]])</template>; totals cover those days only.</span></p>

    <!-- the whole chain at a glance: the management view of every role's work (each step links to its report) -->
    <section aria-labelledby="wf-h">
      <h2 id="wf-h" class="dash-section mt-0">Workflow today</h2>
      <sr-workflow :steps="chain" label="SmartRestaurant workflow, administrator view"></sr-workflow>
    </section>

    <div class="row g-3 mb-3">
      <section class="col-12 col-xl-7" aria-labelledby="na-h"><div class="card h-100"><div class="card-body">
        <h2 id="na-h" class="h6">Needs attention</h2>
        <sr-action-list :items="actions" empty="Forecast, recipes, stock and waste are within their limits."></sr-action-list>
      </div></div></section>

      <!-- ML forecasting performance: hold-out error from training, and accuracy on the reporting period -->
      <section class="col-12 col-xl-5" aria-labelledby="pf-h"><div class="card h-100"><div class="card-body">
        <div class="card-head"><h2 id="pf-h" class="h6">Forecasting performance</h2><a href="/admin/monitor?tab=forecast">Accuracy report</a></div>
        <sr-empty v-if="!d.active_model" message="No active model." icon="layers"></sr-empty>
        <dl v-else class="perf-list">
          <div><dt>Active model</dt><dd><strong>[[ algoName(d.active_model.algorithm) ]]</strong> [[ d.active_model.label ]]
            <span class="sr-badge ms-1" :class="d.active_model.beats_baseline ? 'sr-badge-success' : 'sr-badge-warning'">[[ d.active_model.beats_baseline ? 'beats baseline' : 'below baseline' ]]</span></dd></div>
          <div v-if="perf"><dt>Hold-out error</dt><dd><strong>MAE [[ ui.num(perf.model, 1) ]]</strong> vs [[ ui.num(perf.baseline, 1) ]] baseline<template v-if="perf.wape != null"> · WAPE [[ ui.num(perf.wape, 1) ]]%</template>
            <small class="d-block text-muted">[[ ui.date(perf.from) ]] – [[ ui.date(perf.to) ]], not used in training</small></dd></div>
          <div><dt>This period</dt><dd v-if="d.accuracy"><strong>MAE [[ ui.num(d.accuracy.mae, 1) ]]</strong><template v-if="d.accuracy.wape != null"> · WAPE [[ ui.num(d.accuracy.wape, 1) ]]%</template>
            <small class="d-block text-muted">actual vs forecast on [[ d.accuracy.days ]] day[[ d.accuracy.days === 1 ? '' : 's' ]], [[ d.accuracy.pairs ]] item-days</small></dd>
            <dd v-else class="text-muted">No forecast with recorded sales in this period.</dd></div>
          <div><dt>Last forecast run</dt><dd v-if="d.last_run">[[ ui.dateTime(d.last_run.started_at) ]] <sr-status-badge :status="d.last_run.status === 'ok' ? 'ok' : d.last_run.status"></sr-status-badge></dd><dd v-else class="text-muted">None yet</dd></div>
        </dl>
        <p class="table-note mb-0">MAE: average error in portions per item per day. WAPE: total error as a share of sales.<template v-if="synthetic"> Measured on synthetic demo data.</template></p>
      </div></div></section>
    </div>

    <!-- recorded sales and food waste for the period, then the 7-day ML forecast (predictions, never actual sales) -->
    <section class="card mb-3" aria-labelledby="fc-h"><div class="card-body">
      <div class="card-head"><h2 id="fc-h" class="h6">Sales, food waste and 7-day forecast</h2><a href="/admin/monitor?tab=sales">Reports</a></div>
      <div v-if="trend === undefined" class="sk" style="height: 260px" role="status"><span class="visually-hidden">Loading</span></div>
      <div v-else role="img" aria-label="Recorded portions sold and wasted per day in the period as lines, then predicted portions for the next 7 days as bars">
        <sr-bar-chart :labels="hfLabels" :datasets="hfData" y-title="Portions per day" :height="260" title="" :all-labels="d.range_days === 7"></sr-bar-chart></div>
      <p v-if="trend === null" class="chart-legend-note mt-2 mb-0">The recorded history could not be loaded; the forecast is shown.</p>
      <p v-else-if="trendGaps" class="chart-legend-note mt-2 mb-0">Gaps are days with no records.</p>
      <p v-if="partialItems && forecastDays === 7" class="dash-note note-partial mt-2 mb-0" role="note"><sr-icon name="warning" :size="16"></sr-icon><span>Some days cover fewer than [[ d.menu_items_active ]] items; their totals are partial.</span></p>
    </div></section>

    <div class="row g-3">
      <!-- Alerts (the bell in the top bar links here): open now, or closed -->
      <section class="col-12 col-xl-7" aria-labelledby="al-h"><div class="card h-100" id="alerts"><div class="card-body">
        <div class="card-head"><h2 id="al-h" class="h6">Alerts</h2>
          <span class="count-chips"><span class="chip chip-critical">[[ d.alert_counts.critical ]] critical</span><span class="chip chip-warning">[[ d.alert_counts.warning ]] warning</span></span></div>
        <div class="sr-tabs sr-tabs-sm" role="tablist" aria-label="Alerts">
          <button class="sr-tab" :class="{ active: alertTab === 'open' }" role="tab" :aria-selected="alertTab === 'open' ? 'true' : 'false'" type="button" @click="alertTab = 'open'">Open ([[ alerts.length ]])</button>
          <button class="sr-tab" :class="{ active: alertTab === 'history' }" role="tab" :aria-selected="alertTab === 'history' ? 'true' : 'false'" type="button" @click="showHistory">History</button>
        </div>
        <template v-if="alertTab === 'open'">
          <sr-alert-list :alerts="alerts" :limit="4" @acknowledge="ack"></sr-alert-list>
          <p class="qa-note">Acknowledge marks an alert as seen; it closes when the cause is fixed.</p>
        </template>
        <template v-else>
          <div v-if="history === undefined" class="sk" style="height: 160px" role="status"><span class="visually-hidden">Loading</span></div>
          <sr-empty v-else-if="!history || !history.length" :message="history ? 'No closed alerts yet.' : 'The alert history could not be loaded.'" icon="clock"></sr-empty>
          <ul v-else class="hist-list"><li v-for="a in history.slice(0, 15)" :key="a.id"><span class="alert-msg">[[ a.message ]]</span><small>[[ closedText(a) ]]</small></li></ul>
        </template>
      </div></div></section>

      <div class="col-12 col-xl-5">
        <!-- confirmed pre-orders: committed demand that the prep plan already counts -->
        <section class="card mb-3" aria-labelledby="po-h"><div class="card-body">
          <div class="card-head"><h2 id="po-h" class="h6">Upcoming pre-orders</h2><span v-if="d.pre_orders.count" class="sr-badge sr-badge-success">[[ d.pre_orders.count ]] · [[ d.pre_orders.portions ]] portions</span></div>
          <sr-empty v-if="!d.pre_orders.rows.length" message="No confirmed pre-orders for the next 7 days." icon="bag"></sr-empty>
          <ul v-else class="mini-list">
            <li v-for="p in d.pre_orders.rows.slice(0, 4)" :key="p.id"><span class="mini-main"><strong>[[ p.quantity ]] x [[ p.item ]]</strong><small>[[ ui.date(p.target_date) + (p.pickup_time ? ', ' + p.pickup_time : '') ]][[ p.customer_name ? ' · ' + p.customer_name : '' ]]</small></span></li>
          </ul>
          <p v-if="d.pre_orders.rows.length > 4" class="small text-muted mb-0">and [[ d.pre_orders.rows.length - 4 ]] more</p>
          <p class="table-note mb-0">Confirmed pre-orders are already in the kitchen's prep plan.</p>
        </div></section>

        <section class="card" aria-labelledby="ra-h"><div class="card-body">
          <h2 id="ra-h" class="h6">Recent activity</h2>
          <ul v-if="activity.length" class="activity small"><li v-for="(a, i) in activityShown" :key="i"><span class="when">[[ ui.dateTime(a.time) ]]<template v-if="a.user"> &middot; [[ a.user ]]</template></span><span class="what">[[ a.text ]]<template v-if="a.times > 1"> ([[ a.times ]] times)</template></span></li></ul>
          <sr-empty v-else message="No activity recorded yet." icon="activity"></sr-empty>
          <button v-if="activity.length > 5" class="btn btn-sm btn-link alert-more" type="button" :aria-expanded="allActivity ? 'true' : 'false'" @click="allActivity = !allActivity">[[ allActivity ? 'Show fewer' : 'Show ' + activity.length ]]</button>
        </div></section>
      </div>
    </div>
  </template>
</div>
{% endblock %}
{% block scripts %}<script src="{{ url_for('static', filename='js/pages/admin_dashboard.js') }}"></script>{% endblock %}
