{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="text-center py-5">
  <h1 class="display-6">{{ status }}: {{ title }}</h1>
  <p class="lead">{{ message }}</p>
  {% if request_id %}<p class="text-muted small">Reference: {{ request_id }}</p>{% endif %}
  <a class="btn btn-primary" href="/">Back to home</a>
</div>
{% endblock %}
