{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="state-page">
  <div class="state-code">{{ status }}</div>
  <h1>{{ title }}</h1>
  <p>{{ message }}</p>
  {% if request_id %}<p class="small">Reference: {{ request_id }}</p>{% endif %}
  <a class="btn btn-primary" href="/">Back to {% if current_user.is_authenticated %}my dashboard{% else %}log in{% endif %}</a>
</div>
{% endblock %}
