{% extends "base.html" %}
{% block title %}Access denied{% endblock %}
{% block content %}
<div class="state-page">
  <div class="state-code">403</div>
  <h1>Access denied</h1>
  <p>Your role does not have access to this page.</p>
  <a class="btn btn-primary" href="/">Back to {% if current_user.is_authenticated %}my dashboard{% else %}log in{% endif %}</a>
</div>
{% endblock %}
