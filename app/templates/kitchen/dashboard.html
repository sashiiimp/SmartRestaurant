{% extends "base.html" %}
{% block title %}Kitchen - SmartRestaurant{% endblock %}
{% block content %}
<div id="app" v-cloak>
  <div class="dash-head">
    <div><h1 class="h4 m-0">[[ isToday ? "Today's kitchen" : 'Kitchen' ]]</h1><p class="dash-sub">[[ ui.date(date) ]]</p></div>
    <div class="dash-actions">
      <sr-date-nav v-model="date" @change="load"></sr-date-nav>
      <a class="btn btn-primary btn-lg-touch" href="/kitchen/prep"><sr-icon name="clipboard" :size="16"></sr-icon> Plan &amp; prepare</a>
      <a class="btn btn-outline-primary btn-lg-touch" href="/kitchen/record"><sr-icon name="trash" :size="16"></sr-icon> Record served &amp; waste</a>
    </div>
  </div>
  <div v-if="error" class="alert alert-danger" role="alert">[[ error ]]</div>
  <sr-loading v-if="loading" :tiles="2" :cards="2"></sr-loading>
  <template v-else-if="d">
    <!-- the day in four figures, all from the plan rows below (dashboard_service._kitchen_day); display only.
         To prepare = approved quantities plus suggestions still waiting; Prepared = progress against it. -->
    <div class="kpis">
      <sr-stat-tile label="To prepare" :value="ui.num(d.tiles.planned_total, 0)" unit="portions" icon="clipboard" href="/kitchen/prep" :tone="day.undecided ? 'warning' : 'success'"
        :hint="day.items_forecast ? ui.num(approvedPortions, 0) + ' approved · ' + ui.num(suggestedPortions, 0) + ' suggested' : 'No forecast yet: set quantities by hand'"
        :flag="day.undecided ? day.undecided + (day.undecided === 1 ? ' item awaits' : ' items await') + ' approval' : (day.items_forecast ? 'All ' + day.items_forecast + ' items approved' : null)"></sr-stat-tile>
      <sr-stat-tile label="Prepared" :value="ui.num(day.prepared_total, 0)" :unit="'of ' + ui.num(d.tiles.planned_total, 0)" icon="check" href="/kitchen/prep" :progress="preparedPct"
        :hint="preparedHint" :tone="toGo > 0 ? 'info' : 'success'" :flag="toGo > 0 ? ui.num(toGo, 0) + ' portions still to prepare' : (Number(d.tiles.planned_total) > 0 ? 'Everything prepared' : null)"></sr-stat-tile>
      <sr-stat-tile label="Pre-orders" :value="day.pre_orders.rows.length" :unit="day.pre_orders.rows.length === 1 ? 'order' : 'orders'" icon="bag" href="/kitchen/orders"
        :hint="day.pre_orders.portions + ' confirmed portions in the plan'" :tone="day.pre_orders.pending ? 'warning' : 'success'"
        :flag="day.pre_orders.pending ? day.pre_orders.pending + ' to confirm' : null"></sr-stat-tile>
      <sr-stat-tile label="Served & waste" :value="day.served_total === null ? '–' : ui.num(day.served_total, 0)" :unit="day.served_total === null ? 'not recorded' : 'served'" icon="trash" href="/kitchen/record"
        :hint="ui.num(day.wasted_total, 0) + ' portions wasted'" :tone="day.served_total === null ? 'neutral' : 'success'"
        :flag="day.served_total === null && day.prepared_total > 0 && date <= ui.todayIso() ? 'Record after service' : null"></sr-stat-tile>
    </div>

    <!-- only when something genuinely needs doing; the approval count lives in To prepare above -->
    <section v-if="actions.length" class="card kd-attention dash-row" aria-labelledby="na-h"><div class="card-body">
      <h2 id="na-h" class="h6">Needs attention</h2>
      <sr-action-list :items="actions"></sr-action-list>
    </div></section>

    <div class="row g-3 kd-grid">
      <div class="col-12 col-xl-7 kd-main">
        <section class="card" aria-labelledby="plan-h"><div class="card-body">
          <div class="card-head"><div><h2 id="plan-h" class="h6">[[ isToday ? "Today's preparation plan" : 'Plan for ' + ui.date(date) ]]</h2><p class="card-sub">What to cook, how much, and how far each item is</p></div><a href="/kitchen/prep">Open plan</a></div>
          <p v-if="!d.plan.length" class="kd-none">No forecast for this date yet.</p>
          <div v-else class="table-responsive"><table class="table table-sm align-middle mb-0 plan-table kd-plan">
            <thead><tr><th>Item</th><th class="text-end d-none d-sm-table-cell">Forecast</th><th class="text-end">To prepare</th><th class="col-prepared">Prepared</th><th class="d-none d-sm-table-cell">Status</th></tr></thead>
            <tbody><tr v-for="r in d.plan" :key="r.menu_item_id" :class="'row-' + state(r)">
              <td class="kd-item">[[ r.name ]] <span v-if="!r.is_available" class="sr-badge sr-badge-danger ms-1">Unavailable</span></td>
              <td class="text-end kd-num text-muted d-none d-sm-table-cell">[[ ui.num(r.forecast_qty, 0) ]]</td>
              <td class="text-end kd-num"><span class="plan-qty" :class="'is-' + decision(r)" :title="qtyTitle(r)">[[ toPrepare(r) === null || toPrepare(r) === undefined ? '-' : toPrepare(r) ]]</span>
                <small v-if="decision(r) === 'overridden' && r.recommended_qty !== null" class="plan-was">was [[ r.recommended_qty ]]</small>
                <small class="plan-state d-sm-none" :class="'is-' + state(r)">[[ stateLabel(r) ]]</small></td>
              <td><div class="prep-cell"><div class="progress progress-thin" role="progressbar" :aria-label="'Prepared for ' + r.name" :aria-valuenow="r.prepared" aria-valuemin="0" :aria-valuemax="toPrepare(r) || 0"><div class="progress-bar" :class="barClass(r)" :style="{ width: pct(r) + '%' }"></div></div><span>[[ r.prepared ]]</span></div></td>
              <td class="d-none d-sm-table-cell"><span class="plan-badge" :class="'is-' + state(r)">[[ stateLabel(r) ]]</span></td></tr></tbody></table></div>
          <p v-if="d.plan.length" class="table-note">Suggested = forecast + safety buffer (or confirmed pre-orders, if higher), rounded up to a batch. Approved when the first portions are added, or when you change it.</p>
        </div></section>
      </div>

      <div class="col-12 col-xl-5 kd-side">
        <section class="card" aria-labelledby="sh-h"><div class="card-body">
          <div class="card-head"><div><h2 id="sh-h" class="h6">Ingredient shortages</h2><p class="card-sub">Ingredients this plan needs that are not in stock</p></div><a href="/kitchen/requirements">All ingredients</a></div>
          <p v-if="!d.shortages.length" class="kd-none kd-ok">Enough stock for this plan.</p>
          <template v-else>
            <p class="kd-sub"><span class="kd-when" :class="isFuture ? 'is-projected' : 'is-current'">[[ isFuture ? 'Projected' : 'Current' ]]</span>[[ shortSummary ]]</p>
            <table class="table table-sm align-middle mb-0 short-table">
              <thead><tr><th>Ingredient</th><th class="text-end">Required</th><th class="text-end">Available</th><th class="text-end">Shortage</th></tr></thead>
              <tbody><tr v-for="s in shortRows" :key="s.ingredient_id" :class="isOut(s) ? 'is-out' : 'is-part'">
                <td>[[ s.name ]]</td>
                <td class="text-end"><span class="kd-q">[[ ui.qty(s.required) ]]</span><span class="kd-u">[[ s.unit ]]</span></td>
                <td class="text-end kd-avail" :title="isOut(s) ? 'Out of stock' : null"><span class="kd-q">[[ ui.qty(s.usable_stock) ]]</span><span class="kd-u">[[ s.unit ]]</span></td>
                <td class="text-end short-by"><span class="kd-q">[[ ui.qty(s.short_by) ]]</span><span class="kd-u">[[ s.unit ]]</span></td></tr></tbody></table>
            <p class="table-note">Required = [[ isFuture ? 'projected need for ' + ui.date(date) : "today's need" ]] from the plan and recipes (BOM). Available = usable stock now.</p>
            <div class="kd-foot"><a class="btn btn-primary btn-sm" href="/kitchen/requirements?tab=requests">Request stock</a>
              <small v-if="openRequests">[[ openRequests ]] [[ openRequests === 1 ? 'request is' : 'requests are' ]] already open</small></div>
          </template>
        </div></section>

        <section v-if="day.pre_orders.rows.length" class="card" aria-labelledby="po-h"><div class="card-body">
          <div class="card-head"><h2 id="po-h" class="h6">Pre-orders for this day</h2><a href="/kitchen/orders">All pre-orders</a></div>
          <ul class="mini-list">
            <li v-for="p in day.pre_orders.rows" :key="p.id">
              <span class="mini-main"><strong>[[ p.quantity ]] x [[ p.item ]]</strong><small>[[ p.pickup_time || 'no pickup time' ]] · [[ p.customer_name || ('#' + p.id) ]]</small></span>
              <sr-status-badge :status="p.status"></sr-status-badge>
            </li>
          </ul>
          <p v-if="day.pre_orders.portions" class="table-note mb-0">[[ day.pre_orders.portions ]] confirmed portions are included in the plan.</p>
        </div></section>
      </div>

      <!-- Alerts: the open alerts, acknowledged here, full width so each reads on one or two lines. The preview leaves out
           stock-out alerts for ingredients already in the shortage table (same information); "Show all" lists every open
           alert. Nothing is hidden for good. -->
      <div class="col-12">
        <section class="card" id="alerts" aria-labelledby="al-h"><div class="card-body">
          <div class="card-head"><h2 id="al-h" class="h6">Alerts</h2>
            <button v-if="alerts.length && (allAlerts || alerts.length > preview.length)" class="btn btn-sm btn-link p-0" type="button" :aria-expanded="allAlerts ? 'true' : 'false'" @click="allAlerts = !allAlerts">[[ allAlerts ? 'Show fewer' : 'Show all ' + alerts.length ]]</button></div>
          <sr-alert-list v-if="allAlerts" :alerts="alerts" @acknowledge="ack"></sr-alert-list>
          <template v-else>
            <p v-if="!alerts.length" class="kd-none kd-ok">No open alerts.</p>
            <sr-alert-list v-else-if="preview.length" :alerts="preview" @acknowledge="ack"></sr-alert-list>
            <p v-if="covered.length" class="kd-none">[[ covered.length ]] stock-out [[ covered.length === 1 ? 'alert is' : 'alerts are' ]] for ingredients in <a href="#sh-h">Ingredient shortages</a>.</p>
          </template>
        </div></section>
      </div>
    </div>
  </template>
</div>
{% endblock %}
{% block scripts %}<script src="{{ url_for('static', filename='js/pages/kitchen_dashboard.js') }}"></script>{% endblock %}
