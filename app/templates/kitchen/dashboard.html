{% extends "base.html" %}
{% block title %}Kitchen - SmartRestaurant{% endblock %}
{% block content %}
<div id="app" v-cloak>
  <div class="dash-head">
    <div><h1 class="h4 m-0">[[ isToday ? "Today's kitchen" : 'Kitchen' ]]</h1><p class="dash-sub">[[ ui.date(date) ]]</p></div>
    <div class="dash-actions">
      <sr-date-nav v-model="date" @change="load"></sr-date-nav>
      <a class="btn btn-primary btn-lg-touch" href="/kitchen/prep"><sr-icon name="clipboard" :size="16"></sr-icon> Plan &amp; prepare</a>
      <a class="btn btn-outline-primary btn-lg-touch" href="/kitchen/record"><sr-icon name="trash" :size="16"></sr-icon> Record served &amp; waste</a>
    </div>
  </div>
  <div v-if="error" class="alert alert-danger" role="alert">[[ error ]]</div>
  <sr-loading v-if="loading" :tiles="4" :cards="2"></sr-loading>
  <template v-else-if="d">
    <!-- the day in four figures, all from the plan rows below (dashboard_service._kitchen_day) -->
    <div class="kpis">
      <sr-stat-tile label="ML forecast" :value="day.items_forecast ? ui.num(day.forecast_total, 0) + ' portions' : 'No forecast'" :hint="day.items_forecast + ' of ' + day.items_total + ' items forecast'" :tone="day.items_forecast ? 'info' : 'warning'" icon="trending" href="/kitchen/prep?tab=forecast"></sr-stat-tile>
      <sr-stat-tile label="To prepare" :value="ui.num(d.tiles.planned_total, 0) + ' portions'" :hint="(day.items_forecast - day.undecided) + ' of ' + day.items_forecast + ' items decided'" :tone="day.undecided ? 'warning' : 'success'" icon="clipboard" href="/kitchen/prep"></sr-stat-tile>
      <sr-stat-tile label="Prepared" :value="ui.num(day.prepared_total, 0) + ' portions'" :hint="preparedPct + '% of the plan'" :tone="preparedPct >= 100 ? 'success' : 'accent'" icon="check" href="/kitchen/prep"></sr-stat-tile>
      <sr-stat-tile label="Served / wasted" :value="day.served_total === null ? 'Not recorded' : ui.num(day.served_total, 0) + ' / ' + ui.num(day.wasted_total, 0)" :hint="servedHint" :tone="day.wasted_total ? 'warning' : 'neutral'" icon="trash" href="/kitchen/record"></sr-stat-tile>
    </div>

    <div class="row g-3 mb-3">
      <section class="col-12 col-xl-7" aria-labelledby="na-h"><div class="card h-100"><div class="card-body">
        <h2 id="na-h" class="h6">Needs attention</h2>
        <sr-action-list :items="actions" empty="Everything for this day is on track."></sr-action-list>
      </div></div></section>
      <section class="col-12 col-xl-5" aria-labelledby="po-h"><div class="card h-100"><div class="card-body">
        <div class="card-head"><h2 id="po-h" class="h6">Pre-orders</h2><a href="/kitchen/orders">Orders &amp; pre-orders</a></div>
        <sr-empty v-if="!day.pre_orders.rows.length" message="No pre-orders for this day." icon="bag"></sr-empty>
        <ul v-else class="mini-list">
          <li v-for="p in day.pre_orders.rows" :key="p.id">
            <span class="mini-main"><strong>[[ p.quantity ]] x [[ p.item ]]</strong><small>[[ p.pickup_time || 'no pickup time' ]] · [[ p.customer_name || ('#' + p.id) ]]</small></span>
            <sr-status-badge :status="p.status"></sr-status-badge>
          </li>
        </ul>
        <p v-if="day.pre_orders.portions" class="table-note mb-0">[[ day.pre_orders.portions ]] confirmed portions are included in the plan.</p>
      </div></div></section>
    </div>

    <div class="row g-3">
      <div class="col-12 col-xl-8"><div class="card"><div class="card-body">
        <div class="card-head"><h2 class="h6">[[ isToday ? "Today's plan" : 'Plan for ' + ui.date(date) ]]</h2><a href="/kitchen/prep">Plan &amp; prepare</a></div>
        <sr-empty v-if="!d.plan.length" message="No forecast for this date yet." icon="trending"></sr-empty>
        <div v-else class="table-responsive"><table class="table table-sm align-middle mb-0 plan-table">
          <thead><tr><th>Item</th><th class="text-end d-none d-sm-table-cell">Forecast</th><th class="text-end">To prepare</th><th class="col-prepared">Prepared</th><th class="d-none d-sm-table-cell">Status</th></tr></thead>
          <tbody><tr v-for="r in d.plan" :key="r.menu_item_id">
            <td>[[ r.name ]] <span v-if="!r.is_available" class="sr-badge sr-badge-danger ms-1">Unavailable</span></td>
            <td class="text-end text-muted d-none d-sm-table-cell">[[ ui.num(r.forecast_qty, 0) ]]</td>
            <td class="text-end fw-semibold">[[ toPrepare(r) ]]</td>
            <td><div class="prep-cell"><div class="progress progress-thin" role="progressbar" :aria-label="'Prepared for ' + r.name" :aria-valuenow="r.prepared" aria-valuemin="0" :aria-valuemax="toPrepare(r)"><div class="progress-bar" :class="r.prep_status === 'done' ? 'bg-success' : ''" :style="{ width: pct(r) + '%' }"></div></div><span>[[ r.prepared ]]</span></div></td>
            <td class="d-none d-sm-table-cell"><sr-status-badge :status="r.prep_status || r.status"></sr-status-badge></td></tr></tbody></table></div>
        <p class="table-note">To prepare = forecast + safety buffer (or confirmed pre-orders, if higher), rounded up to a whole batch, until you accept or change it.</p>
      </div></div></div>
      <div class="col-12 col-xl-4">
        <div class="card mb-3"><div class="card-body">
          <div class="card-head"><h2 class="h6">Ingredient shortages</h2><a href="/kitchen/requirements">Ingredients</a></div>
          <sr-empty v-if="!d.shortages.length" message="No shortages for this plan." icon="check"></sr-empty>
          <template v-else>
            <ul class="short-list"><li v-for="s in d.shortages" :key="s.ingredient_id"><strong>[[ s.name ]]</strong><span>short by [[ ui.qty(s.short_by, s.unit) ]]</span><small>need [[ ui.qty(s.required, s.unit) ]], have [[ ui.qty(s.usable_stock, s.unit) ]]</small></li></ul>
            <a class="btn btn-outline-primary btn-sm mt-2" href="/kitchen/requirements?tab=requests">Request stock</a>
          </template>
        </div></div>
        <div class="card" id="alerts"><div class="card-body"><h2 class="h6">Alerts</h2><sr-alert-list :alerts="alerts" :limit="3" @acknowledge="ack"></sr-alert-list></div></div>
      </div>
    </div>
  </template>
</div>
{% endblock %}
{% block scripts %}<script src="{{ url_for('static', filename='js/pages/kitchen_dashboard.js') }}"></script>{% endblock %}
