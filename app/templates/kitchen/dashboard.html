{% extends "base.html" %}
{% block title %}Kitchen - SmartRestaurant{% endblock %}
{% block content %}
<div id="app" v-cloak>
  <div class="dash-head">
    <div><h1 class="h4 m-0">[[ isToday ? "Today's kitchen" : 'Kitchen' ]]</h1><p class="dash-sub">[[ ui.date(date) ]]</p></div>
    <div class="dash-actions">
      <sr-date-nav v-model="date" @change="load"></sr-date-nav>
      <a class="btn btn-primary btn-lg-touch" href="/kitchen/prep"><sr-icon name="clipboard" :size="16"></sr-icon> Open prep plan</a>
      <a class="btn btn-outline-primary btn-lg-touch" href="/kitchen/record"><sr-icon name="trash" :size="16"></sr-icon> Record served &amp; waste</a>
    </div>
  </div>
  <div v-if="error" class="alert alert-danger" role="alert">[[ error ]]</div>
  <sr-loading v-if="loading" :tiles="3" :cards="2"></sr-loading>
  <template v-else-if="d">
    <div class="row g-3 mb-3">
      <div class="col-12 col-lg-6"><div class="card stat-tile h-100" :class="preparedPct >= 100 ? 'tone-success' : 'tone-accent'"><div class="card-body">
        <div class="stat-top"><div class="stat-label">Preparation progress</div><span class="stat-icon"><sr-icon name="check" :size="18"></sr-icon></span></div>
        <div class="value"><a href="/kitchen/prep" class="stretched-link">[[ preparedPct ]]%</a></div>
        <div class="progress progress-thin mt-2" role="progressbar" aria-label="Portions prepared" :aria-valuenow="preparedPct" aria-valuemin="0" aria-valuemax="100"><div class="progress-bar" :class="{ 'bg-success': preparedPct >= 100 }" :style="{ width: preparedPct + '%' }"></div></div>
        <div class="stat-hint mt-1">[[ ui.num(d.tiles.prepared_total, 0) ]] of [[ ui.num(d.tiles.planned_total, 0) ]] portions prepared<span v-if="d.tiles.items_planned"> · [[ d.tiles.items_done ]] of [[ d.tiles.items_planned ]] items done</span></div>
      </div></div></div>
      <div class="col-6 col-lg-3"><sr-stat-tile label="Ingredient shortages" icon="warning" :value="d.tiles.shortage_count" :hint="d.tiles.shortage_count ? 'for this plan' : 'none for this plan'" :tone="d.tiles.shortage_count ? 'danger' : 'success'" href="/kitchen/requirements"></sr-stat-tile></div>
      <div class="col-6 col-lg-3"><sr-stat-tile label="Open alerts" icon="bell" :value="d.tiles.open_alerts" :tone="d.tiles.open_alerts ? 'warning' : 'success'" href="#alerts"></sr-stat-tile></div>
    </div>
    <div class="row g-3">
      <div class="col-12 col-xl-8"><div class="card"><div class="card-body">
        <div class="card-head"><h2 class="h6">[[ isToday ? "Today's plan" : 'Plan for ' + ui.date(date) ]]</h2><a href="/kitchen/prep">Accept or change in Prep plan</a></div>
        <sr-empty v-if="!d.plan.length" message="No forecast for this date yet." icon="trending"></sr-empty>
        <div v-else class="table-responsive"><table class="table table-sm align-middle mb-0 plan-table">
          <thead><tr><th>Item</th><th class="text-end d-none d-sm-table-cell">Forecast</th><th class="text-end">To prepare</th><th class="col-prepared">Prepared</th><th class="d-none d-sm-table-cell">Status</th></tr></thead>
          <tbody><tr v-for="r in d.plan" :key="r.menu_item_id">
            <td>[[ r.name ]] <span v-if="!r.is_available" class="sr-badge sr-badge-danger ms-1">Unavailable</span></td>
            <td class="text-end text-muted d-none d-sm-table-cell">[[ ui.num(r.forecast_qty, 0) ]]</td>
            <td class="text-end fw-semibold">[[ toPrepare(r) ]]</td>
            <td><div class="prep-cell"><div class="progress progress-thin" role="progressbar" :aria-label="'Prepared for ' + r.name" :aria-valuenow="r.prepared" aria-valuemin="0" :aria-valuemax="toPrepare(r)"><div class="progress-bar" :class="r.prep_status === 'done' ? 'bg-success' : ''" :style="{ width: pct(r) + '%' }"></div></div><span>[[ r.prepared ]]</span></div></td>
            <td class="d-none d-sm-table-cell"><sr-status-badge :status="r.prep_status || r.status"></sr-status-badge></td></tr></tbody></table></div>
        <p class="table-note">"To prepare" is the quantity you accepted or set; until then it shows the recommendation: the forecast plus the safety buffer (or the confirmed pre-orders, if higher), rounded up to a whole batch.</p>
      </div></div></div>
      <div class="col-12 col-xl-4">
        <div class="card mb-3"><div class="card-body">
          <div class="card-head"><h2 class="h6">Ingredient shortages</h2><a href="/kitchen/requirements">Ingredient needs</a></div>
          <sr-empty v-if="!d.shortages.length" message="No shortages for this plan." icon="check"></sr-empty>
          <template v-else>
            <ul class="short-list"><li v-for="s in d.shortages" :key="s.ingredient_id"><strong>[[ s.name ]]</strong><span>short by [[ ui.qty(s.short_by, s.unit) ]]</span><small>need [[ ui.qty(s.required, s.unit) ]], have [[ ui.qty(s.usable_stock, s.unit) ]]</small></li></ul>
            <a class="btn btn-outline-primary btn-sm mt-2" href="/kitchen/requirements?tab=requests">Request stock</a>
          </template>
        </div></div>
        <div class="card" id="alerts"><div class="card-body"><h2 class="h6">Alerts</h2><sr-alert-list :alerts="alerts" :limit="3" @acknowledge="ack"></sr-alert-list></div></div>
      </div>
    </div>
  </template>
</div>
{% endblock %}
{% block scripts %}<script src="{{ url_for('static', filename='js/pages/kitchen_dashboard.js') }}"></script>{% endblock %}
