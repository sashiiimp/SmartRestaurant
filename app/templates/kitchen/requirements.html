{% extends "hub.html" %}
{% block title %}Ingredient requirements - SmartRestaurant{% endblock %}
{% block panel %}
<div id="app" v-cloak>
  <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
    <h2 class="h5 m-0">Needs &amp; shortages</h2><sr-date-nav v-model="date" @change="load"></sr-date-nav>
  </div>
  <div v-if="error" class="alert alert-danger" role="alert">[[ error ]]</div>
  <sr-loading v-if="loading"></sr-loading>
  <template v-else-if="r">
    <p class="page-intro">Planned portions x recipe, against usable stock (expired stock not counted).</p>
    <div v-if="r.ingredients.length" class="count-chips mb-3"><span class="chip" :class="shortCount ? 'chip-critical' : 'chip-info'">[[ shortCount ]] short</span><span class="chip chip-info">[[ r.ingredients.length - shortCount ]] sufficient</span></div>
    <sr-empty v-if="!r.ingredients.length" message="No requirements yet: there is no plan for this date."></sr-empty>
    <div v-else class="table-responsive"><table class="table table-sm align-middle">
      <thead><tr><th>Ingredient</th><th class="text-end">Required</th><th class="text-end">Usable stock</th><th>Status</th><th class="text-end">Short by</th><th></th></tr></thead>
      <tbody><template v-for="i in sortedIngredients" :key="i.ingredient_id"><tr :class="i.status === 'short' ? 'table-danger' : ''">
        <td>[[ i.name ]]</td><td class="text-end">[[ ui.qty(i.required, i.unit) ]]</td><td class="text-end">[[ ui.qty(i.usable_stock, i.unit) ]]</td>
        <td><sr-status-badge :status="i.status"></sr-status-badge></td><td class="text-end">[[ i.short_by ? ui.qty(i.short_by, i.unit) : '' ]]</td>
        <td class="text-nowrap text-end"><button class="btn btn-sm" :class="i.status === 'short' ? 'btn-outline-danger' : 'btn-outline-secondary'" type="button" :aria-expanded="ask === i.ingredient_id ? 'true' : 'false'" @click="toggle(i)">Ask inventory</button></td></tr>
        <!-- one action, two choices: ask for the missing quantity (stock request) or say the stock is not what the system shows (shortage report) -->
        <tr v-if="ask === i.ingredient_id" class="ask-row"><td colspan="6"><div class="ask-panel">
          <div class="ask-choice"><strong>Need more?</strong><small v-if="i.status === 'short'">Ask for the [[ ui.qty(i.short_by, i.unit) ]] that is missing.</small><small v-else>Ask for a quantity of [[ i.name ]].</small>
            <a class="btn btn-sm btn-outline-primary" :href="'/kitchen/requirements?tab=requests&ingredient=' + i.ingredient_id + (i.short_by ? '&qty=' + i.short_by : '')">Request stock</a></div>
          <div class="ask-choice"><strong>Stock does not match?</strong><small>The system shows [[ ui.qty(i.usable_stock, i.unit) ]] usable; tell Inventory what you found.</small>
            <div class="d-flex gap-2"><input class="form-control form-control-sm" :id="'note-' + i.ingredient_id" v-model="note" maxlength="255" placeholder="What did you find? (optional)" :aria-label="'Note for ' + i.name">
              <button class="btn btn-sm btn-outline-danger text-nowrap" type="button" :disabled="busy" @click="report(i)">Report shortage</button></div></div>
        </div></td></tr></template></tbody></table></div>
    <div v-if="r.cannot_compute.length" class="alert alert-warning">
      <strong>Cannot compute:</strong>
      <span v-for="c in r.cannot_compute" :key="c.menu_item_id + c.reason" class="d-block">[[ c.name ]]: [[ c.reason === 'no_recipe' ? 'no recipe defined' : 'no forecast yet' ]]</span>
    </div>
  </template>
</div>
{% endblock %}
{% block scripts %}<script src="{{ url_for('static', filename='js/pages/kitchen_requirements.js') }}"></script>{% endblock %}
