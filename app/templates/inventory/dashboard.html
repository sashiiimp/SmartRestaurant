{% extends "base.html" %}
{% block title %}Inventory - SmartRestaurant{% endblock %}
{% block content %}
<div id="app" v-cloak>
  <h1 class="h4 mb-3">Inventory and purchasing</h1>
  <div v-if="error" class="alert alert-danger" role="alert">[[ error ]]</div>
  <sr-loading v-if="loading" :tiles="4" :cards="2"></sr-loading>
  <template v-else-if="d">
    <div class="row g-3 mb-3">
      <div class="col-6 col-lg-3"><sr-stat-tile label="Stock OK" icon="check" :value="d.counts.ok" tone="success" href="/inventory/stock"></sr-stat-tile></div>
      <div class="col-6 col-lg-3"><sr-stat-tile label="Low" icon="warning" :value="d.counts.low" :tone="d.counts.low ? 'warning' : ''" href="/inventory/stock"></sr-stat-tile></div>
      <div class="col-6 col-lg-3"><sr-stat-tile label="Out of stock" icon="alert" :value="d.counts.out" :tone="d.counts.out ? 'danger' : ''" href="/inventory/stock"></sr-stat-tile></div>
      <div class="col-6 col-lg-3"><sr-stat-tile label="Open alerts" icon="bell" :value="d.alert_counts.critical + d.alert_counts.warning" :hint="d.alert_counts.critical + ' critical'"></sr-stat-tile></div>
    </div>
    <div class="row g-3">
      <div class="col-12 col-xl-7">
        <div class="card mb-3"><div class="card-body">
          <div class="card-head"><h2 class="h6">Reorder now (top 5)</h2><a href="/inventory/reorder">All suggestions</a></div>
          <sr-empty v-if="!d.reorder.length" message="Nothing to reorder."></sr-empty>
          <div v-else class="table-responsive"><table class="table table-sm mb-0"><thead><tr><th>Ingredient</th><th class="text-end">Suggested</th><th>Supplier</th></tr></thead>
            <tbody><tr v-for="r in d.reorder" :key="r.ingredient_id"><td>[[ r.name ]]</td><td class="text-end">[[ ui.qty(r.suggested_qty, r.unit) ]]</td><td>[[ r.supplier ]] <span class="text-muted small">([[ r.lead_time_days ]] d)</span></td></tr></tbody></table></div>
        </div></div>
        <div class="card mb-3"><div class="card-body">
          <div class="card-head"><h2 class="h6">Next 7 days: need vs usable stock</h2></div>
          <div v-for="r in d.need_vs_stock" :key="r.name" class="need-row">
            <div class="d-flex justify-content-between small mb-1"><span class="fw-semibold">[[ r.name ]]</span><span class="text-muted">need [[ ui.qty(r.need, r.unit) ]] &middot; have [[ ui.qty(r.usable, r.unit) ]]</span></div>
            <div class="progress" role="img" :aria-label="r.name + ' need versus stock'">
              <div class="progress-bar bg-secondary" style="background: #cbd5e1 !important" :style="{ width: (r.usable / maxNeed * 100) + '%' }"></div></div>
            <div class="progress mt-1"><div class="progress-bar" :class="r.need > r.usable ? 'bg-danger' : 'bg-success'" :style="{ width: (r.need / maxNeed * 100) + '%' }"></div></div>
          </div>
          <div class="need-legend"><span><i style="background:#cbd5e1"></i>Usable stock</span><span><i style="background:#198754"></i>7-day need</span><span><i style="background:#dc3545"></i>7-day need (stock will not cover it)</span></div>
        </div></div>
        <div class="card"><div class="card-body">
          <div class="card-head"><h2 class="h6">Expiring soon</h2></div>
          <sr-empty v-if="!d.expiring.length" message="No batches expiring in the next 3 days."></sr-empty>
          <div v-else class="table-responsive"><table class="table table-sm mb-0"><thead><tr><th>Ingredient</th><th>Batch</th><th class="text-end">Qty</th><th>Expiry</th></tr></thead>
            <tbody><tr v-for="b in d.expiring" :key="b.id" :class="b.expired ? 'table-danger' : ''"><td>[[ b.ingredient ]]</td><td>[[ b.batch_no ]]</td><td class="text-end">[[ ui.qty(b.qty_remaining, b.unit) ]]</td>
              <td>[[ ui.date(b.expiry_date) ]] <span v-if="b.expired" class="badge text-bg-danger">expired</span></td></tr></tbody></table></div>
        </div></div>
      </div>
      <div class="col-12 col-xl-5">
        <div class="card mb-3"><div class="card-body">
          <div class="card-head"><h2 class="h6">Stock status</h2><a href="/inventory/stock">View stock</a></div>
          <div class="row align-items-center g-2">
            <div class="col-12 col-sm-6 col-xl-12 col-xxl-6"><sr-doughnut-chart :labels="['OK', 'Low', 'Out of stock']" :data="[d.counts.ok, d.counts.low, d.counts.out]" :colors="['#2f9e6b', '#e0a020', '#b42318']" :center-value="stockTotal" center-label="ingredients" title="Ingredients by stock status"></sr-doughnut-chart></div>
            <div class="col-12 col-sm-6 col-xl-12 col-xxl-6"><div class="legend-list">
              <div><span><span class="legend-dot" style="background:#2f9e6b"></span>OK</span><strong>[[ d.counts.ok ]]</strong></div>
              <div><span><span class="legend-dot" style="background:#e0a020"></span>Low</span><strong>[[ d.counts.low ]]</strong></div>
              <div><span><span class="legend-dot" style="background:#b42318"></span>Out of stock</span><strong>[[ d.counts.out ]]</strong></div></div></div>
          </div>
        </div></div>
        <div class="card"><div class="card-body"><div class="card-head"><h2 class="h6">Alerts</h2></div><sr-alert-list :alerts="d.alerts" @acknowledge="ack"></sr-alert-list></div></div>
      </div>
    </div>
  </template>
</div>
{% endblock %}
{% block scripts %}<script src="{{ url_for('static', filename='js/pages/inventory_dashboard.js') }}"></script>{% endblock %}
